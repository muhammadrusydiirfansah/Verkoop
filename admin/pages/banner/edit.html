<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Banner | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/banner/edit.css">
</head>

<body data-page-title="Edit Banner" data-active-menu="banner.html">

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- AREA UTAMA -->
        <main class="main-area">

            <!-- HEADER -->
            <div id="header-container"></div>

            <!-- KONTEN EDIT BANNER -->
            <section class="banner-content">

                <div class="banner-form-card">
                    <h3>Perbarui Data Banner</h3>

                    <form id="formEdit">
                        <div class="form-field">
                            <label for="gambar">Gambar Banner</label>
                            <input type="file" id="gambar" name="gambar" accept="image/*">
                            <small class="form-hint" id="gambarSaatIni"></small>
                        </div>

                        <div class="form-field">
                            <label for="nama">Nama Banner</label>
                            <input type="text" id="nama" name="nama" required>
                        </div>

                        <div class="form-field">
                            <label for="urutan">Urutan</label>
                            <input type="number" id="urutan" name="urutan" min="1" required>
                        </div>

                        <div class="form-actions">
                            <a href="banner.html" class="btn-banner btn-banner-dark">Batal</a>
                            <button type="submit" class="btn-banner btn-banner-dark">Perbarui Banner</button>
                        </div>
                    </form>
                </div>

            </section>

        </main>

    </div>

    <script src="../../js/admin.js"></script>
    
</body>
</html>
