<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Produk | Verkoop</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Utama Admin -->
    <link rel="stylesheet" href="../../css/admin.css">

    <!-- CSS Create Produk -->
    <link rel="stylesheet" href="../../css/kategori/create.css">
</head>

<body data-page-title="Create Produk">

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- AREA UTAMA -->
        <main class="main-area">

            <!-- HEADER -->
            <div id="header-container"></div>

            <!-- KONTEN EDIT PRODUK -->
            <section class="produk-edit-content">

                <div class="produk-edit-container">

                    <h2>Perbarui Data Produk</h2>

                    <form class="produk-edit-form">

                        <!-- GAMBAR PRODUK -->
                        <div class="form-group">
                            <label for="gambar">Gambar Produk</label>

                            <input
                                type="file"
                                id="gambar"
                                name="gambar"
                                accept="image/*"
                            >
                        </div>

                        <!-- NAMA PRODUK -->
                        <div class="form-group">
                            <label for="nama">Nama Produk</label>

                            <input
                                type="text"
                                id="nama"
                                name="nama"
                            >
                        </div>

                        <!-- HARGA PRODUK -->
                        <div class="form-group">
                            <label for="harga">Harga Produk</label>

                            <input
                                type="number"
                                id="harga"
                                name="harga"
                            >
                        </div>

                        <!-- DESKRIPSI PRODUK -->
                        <div class="form-group">
                            <label for="deskripsi">Deskripsi Produk</label>

                            <textarea
                                id="deskripsi"
                                name="deskripsi"
                                rows="2"
                            ></textarea>
                        </div>

                        <!-- TOMBOL AKSI -->
                        <div class="form-actions">

                            <a href="index.html" class="btn-cancel">
                                Batal
                            </a>

                            <button type="submit" class="btn-update">
                                Perbarui Produk
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

    <!-- JAVASCRIPT ADMIN -->
    <script src="../../js/admin.js"></script>

    <!-- JUDUL HEADER -->
    <script>
        const observer = new MutationObserver(() => {

            const title = document.getElementById("page-title");

            if (title) {
                title.textContent = "Edit Produk";
                observer.disconnect();
            }

        });

        observer.observe(
            document.getElementById("header-container"),
            { childList: true, subtree: true }
        );
    </script>

</body>
</html>
