<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Produk | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/produk/edit.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- AREA UTAMA -->
        <main class="main-area">

            <!-- HEADER -->
            <div id="header-container"></div>

            <!-- KONTEN FORM EDIT PRODUK -->
            <section class="dashboard-content">

                <div class="product-form-container">

                    <h2 class="product-form-title">
                        Perbarui Data Produk
                    </h2>

                    <form class="product-form">

                        <!-- GAMBAR PRODUK -->
                        <div class="form-group">

                            <label for="gambarProduk">
                                Gambar Produk
                            </label>

                            <input
                                type="file"
                                id="gambarProduk"
                                name="gambarProduk"
                                accept="image/*"
                            >

                        </div>

                        <!-- NAMA PRODUK -->
                        <div class="form-group">

                            <label for="namaProduk">
                                Nama Produk
                            </label>

                            <input
                                type="text"
                                id="namaProduk"
                                name="namaProduk"
                                required
                            >

                        </div>

                        <!-- HARGA PRODUK -->
                        <div class="form-group">

                            <label for="hargaProduk">
                                Harga Produk
                            </label>

                            <input
                                type="number"
                                id="hargaProduk"
                                name="hargaProduk"
                                min="0"
                                required
                            >

                        </div>

                        <!-- DESKRIPSI PRODUK -->
                        <div class="form-group">

                            <label for="deskripsiProduk">
                                Deskripsi Produk
                            </label>

                            <textarea
                                id="deskripsiProduk"
                                name="deskripsiProduk"
                                rows="3"
                                required
                            ></textarea>

                        </div>

                        <!-- TOMBOL FORM -->
                        <div class="form-buttons">

                            <a href="produk.html" class="cancel-btn">
                                Batal
                            </a>

                            <button type="submit" class="save-product-btn">
                                Perbarui Produk
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../../js/admin.js"></script>

</body>
</html>
