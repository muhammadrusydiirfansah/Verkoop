<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Struktur Organisasi | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/struktur/edit.css">
</head>

<body data-title="Tambah Struktur Organisasi">

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- AREA UTAMA -->
        <main class="main-area">

            <!-- HEADER -->
            <div id="header-container"></div>

            <!-- KONTEN FORM -->
            <section class="form-content">

                <form class="form-card" action="#" method="post">

                    <h3 class="form-title">Form Penambahan Struktur Organisasi</h3>

                    <div class="form-group">
                        <label for="namaAnggota">Nama Anggota</label>
                        <input type="text" id="namaAnggota" name="nama_anggota" required>
                    </div>

                    <div class="form-group">
                        <label for="jabatan">Jabatan</label>
                        <input type="text" id="jabatan" name="jabatan" required>
                    </div>

                    <div class="form-group">
                        <label for="deskripsi">Deskripsi</label>
                        <input type="text" id="deskripsi" name="deskripsi">
                    </div>

                    <div class="form-actions">
                        <a href="index.html" class="btn-batal">Batal</a>
                        <button type="submit" class="btn-simpan">Simpan Anggota</button>
                    </div>

                </form>

            </section>

        </main>

    </div>

    <script src="../../js/admin.js"></script>

</body>
</html>
