<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verkoop | Kantin Jurusan Kesehatan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/tentang.css">
    <link rel="stylesheet" href="css/kategori.css">
    <link rel="stylesheet" href="css/struktur.css">
    <link rel="stylesheet" href="css/mitra.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/whatsapp.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        #tentang,
        #kategori,
        #struktur {
            scroll-margin-top: 90px;
        }
    </style>
</head>

<body>
    <div id="header"></div>

    <main>
        <div id="banner"></div>
        <div id="tentang"></div>
        <div id="kategori"></div>
        <div id="struktur"></div>
        <div id="mitra"></div>
    </main>

    <div id="footer"></div>

    <div id="whatsapp"></div>

    <!-- JavaScript Carousel -->
    <script src="js/banner.js"></script>

    <!-- JavaScript AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);

                if (!response.ok) {
                    throw new Error(`Gagal memuat ${file}`);
                }

                const data = await response.text();
                document.getElementById(id).innerHTML = data;

            } catch (error) {
                console.error(error);
            }
        }

        function initHeaderScroll() {
            const header = document.querySelector('.main-header');

            if (!header) return;

            function handleScroll() {
                header.classList.toggle('scrolled', window.scrollY > 50);
            }

            window.addEventListener('scroll', handleScroll);
            handleScroll();
        }

        function initMobileNavigation() {
            const toggle = document.querySelector('.nav-toggle');
            const navigation = document.querySelector('.main-nav');

            if (!toggle || !navigation) return;

            const closeMenu = () => {
                navigation.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Buka menu navigasi');
                toggle.querySelector('i').className = 'bi bi-list';
            };

            toggle.addEventListener('click', () => {
                const isOpen = navigation.classList.toggle('open');
                toggle.setAttribute('aria-expanded', String(isOpen));
                toggle.setAttribute('aria-label', isOpen ? 'Tutup menu navigasi' : 'Buka menu navigasi');
                toggle.querySelector('i').className = isOpen ? 'bi bi-x-lg' : 'bi bi-list';
            });

            navigation.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) closeMenu();
            });
        }

        async function loadLandingPage() {
            await loadComponent('header', 'components/header.html');
            initHeaderScroll();
            initMobileNavigation();

            await loadComponent('banner', 'pages/banner.html');
            initHeroCarousel();

            await loadComponent('tentang', 'pages/tentang.html');
            await loadComponent('kategori', 'pages/kategori.html');
            await loadComponent('struktur', 'pages/struktur.html');
            await loadComponent('mitra', 'pages/mitra.html');

            await loadComponent('footer', 'components/footer.html');
            await loadComponent('whatsapp', 'components/whatsapp.html');

            // Inisialisasi AOS setelah semua komponen dimuat
            AOS.init({
                duration: 800,
                once: false,
                offset: 100
            });

            // Memperbarui elemen yang terdeteksi AOS
            AOS.refreshHard();
        }

        loadLandingPage();
    </script>
</body>

</html>
