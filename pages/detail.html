<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk | Verkoop</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/detail.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/whatsapp.css">
</head>

<body>
    <div id="header"></div>

    <main>
        <section class="detail-section">
            <div class="detail-hero">
                <h1>Detail Produk</h1>
                <div class="detail-container">
                    <a class="detail-back" href="produk.html">
                        <i class="bi bi-arrow-left"></i>
                        Kembali
                    </a>
                </div>
            </div>

            <div class="detail-content">
                <div class="detail-container">
                    <article class="detail-product-card">
                        <div class="detail-product-image" id="detail-image"></div>

                        <div class="detail-product-information">
                            <span class="detail-product-status" id="detail-status">Produk Mitra</span>
                            <h2 id="detail-name">Produk</h2>
                            <p class="detail-product-price" id="detail-price"></p>
                            <p class="detail-product-description" id="detail-description"></p>

                            <div class="detail-partner" id="detail-partner" hidden>
                                <span>Mitra</span>
                                <strong id="detail-partner-name"></strong>
                            </div>
                        </div>
                    </article>

                    <div class="related-heading">
                        <h2>Produk Lainnya</h2>
                        <a href="produk.html">Lihat Selengkapnya <i class="bi bi-arrow-up-right"></i></a>
                    </div>

                    <div class="related-grid" id="related-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <div id="whatsapp"></div>

    <script src="../js/products.js"></script>
    <script>
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`Gagal memuat ${file}`);
                document.getElementById(id).innerHTML = await response.text();
            } catch (error) {
                console.error(error);
            }
        }

        function initHeaderScroll() {
            const header = document.querySelector('.main-header');
            if (!header) return;
            const updateHeader = () => header.classList.toggle('scrolled', window.scrollY > 50);
            window.addEventListener('scroll', updateHeader);
            updateHeader();
        }

        function initMobileNavigation() {
            const toggle = document.querySelector('.nav-toggle');
            const navigation = document.querySelector('.main-nav');
            if (!toggle || !navigation) return;

            const closeMenu = () => {
                navigation.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Buka menu navigasi');
                toggle.querySelector('i').className = 'bi bi-list';
            };

            toggle.addEventListener('click', () => {
                const isOpen = navigation.classList.toggle('open');
                toggle.setAttribute('aria-expanded', String(isOpen));
                toggle.setAttribute('aria-label', isOpen ? 'Tutup menu navigasi' : 'Buka menu navigasi');
                toggle.querySelector('i').className = isOpen ? 'bi bi-x-lg' : 'bi bi-list';
            });
            navigation.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) closeMenu();
            });
        }

        function formatRupiah(price) {
            return 'Rp. ' + price.toLocaleString('id-ID');
        }

        function renderProductDetail() {
            const products = window.VerkoopProducts;
            const productId = Number(new URLSearchParams(window.location.search).get('id'));
            const product = products.find(item => item.id === productId) || products[0];

            document.title = `${product.name} | Detail Produk Verkoop`;

            const image = document.getElementById('detail-image');
            if (product.image) {
                image.innerHTML = `<img src="${product.image}" alt="${product.name}">`;
            } else {
                image.innerHTML = `<i class="bi ${product.icon}" aria-hidden="true"></i>`;
            }

            document.getElementById('detail-name').textContent = product.name;
            document.getElementById('detail-price').textContent = formatRupiah(product.price);
            document.getElementById('detail-description').textContent = product.description;

            const status = document.getElementById('detail-status');
            status.textContent = product.partner ? 'Produk Mitra' : 'Produk Kantin';
            status.classList.toggle('partner', Boolean(product.partner));

            const partner = document.getElementById('detail-partner');
            if (product.partner) {
                partner.hidden = false;
                document.getElementById('detail-partner-name').textContent = product.partner;
            }

            const relatedGrid = document.getElementById('related-grid');
            const relatedProducts = products
                .filter(item => item.id !== product.id)
                .slice(0, 6);

            relatedGrid.innerHTML = relatedProducts.map(item => `
                <article class="related-card">
                    <a class="related-image" href="detail.html?id=${item.id}" aria-label="Lihat ${item.name}">
                        ${item.image
                            ? `<img src="${item.image}" alt="${item.name}">`
                            : `<i class="bi ${item.icon}" aria-hidden="true"></i>`}
                    </a>
                    <div class="related-information">
                        <div class="related-name-row">
                            <h3>${item.name}</h3>
                            <i class="bi ${item.icon}" aria-hidden="true"></i>
                        </div>
                        <p>${formatRupiah(item.price)}</p>
                        <a class="related-detail-button" href="detail.html?id=${item.id}">Lihat Detail</a>
                    </div>
                </article>
            `).join('');
        }

        async function loadPage() {
            await loadComponent('header', '../components/header.html');
            initHeaderScroll();
            initMobileNavigation();
            renderProductDetail();
            await loadComponent('footer', '../components/footer.html');
            await loadComponent('whatsapp', '../components/whatsapp.html');
        }

        loadPage();
    </script>
</body>
</html>
