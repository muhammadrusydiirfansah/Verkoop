<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk | Verkoop</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/detail.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/whatsapp.css">
    <link rel="stylesheet" href="../css/typography.css">
</head>

<body>
    <div id="header"></div>

    <main>
        <section class="detail-section">
            <div class="detail-hero">
                <h1>Detail Produk</h1>
                <div class="detail-container">
                    <a class="detail-back" href="produk.html">
                        <i class="bi bi-arrow-left"></i>
                        Kembali
                    </a>
                </div>
            </div>

            <div class="detail-content">
                <div class="detail-container">
                    <article class="detail-product-card">
                        <div class="detail-product-image" id="detail-image"></div>

                        <div class="detail-product-information">
                            <span class="detail-product-status" id="detail-status">Produk Mitra</span>
                            <h2 id="detail-name">Produk</h2>
                            <p class="detail-product-price" id="detail-price"></p>
                            <p class="detail-product-description" id="detail-description"></p>

                            <div class="detail-partner" id="detail-partner" hidden>
                                <span>Mitra</span>
                                <strong id="detail-partner-name"></strong>
                            </div>
                        </div>
                    </article>

                    <div class="related-heading">
                        <h2>Produk Lainnya</h2>
                        <a href="produk.html">Lihat Selengkapnya <i class="bi bi-arrow-up-right"></i></a>
                    </div>

                    <div class="related-grid" id="related-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <div id="whatsapp"></div>

    <script src="../js/produk.js"></script>
    <script src="../js/detail.js"></script>
</body>
</html>
