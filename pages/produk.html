
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/produk.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/whatsapp.css">
</head>

<body>

    <div id="header"></div>

    <main>
        <section class="product-section">

            <!-- HERO PRODUK -->
            <div class="product-hero">
                <div class="product-container">

                    <h1>Produk</h1>

                    <div class="product-controls">

                        <div class="product-search">
                            <i class="bi bi-search"></i>
                            <input
                                type="search"
                                id="product-search"
                                placeholder="Cari nama produk"
                                autocomplete="off"
                                aria-label="Cari nama produk">
                        </div>

                        <div class="product-filter">
                            <select id="product-category" aria-label="Filter kategori produk">
                                <option value="">Semua Produk</option>
                                <option value="Makanan Berat">Makanan Berat</option>
                                <option value="Makanan Ringan">Makanan Ringan</option>
                                <option value="Minuman">Minuman</option>
                            </select>
                            <i class="bi bi-sliders"></i>
                        </div>

                    </div>

                </div>
            </div>

            <!-- DAFTAR PRODUK -->
            <div class="product-content">
                <div class="product-container">

                    <div class="product-grid" id="product-grid">
                        <!-- Kartu produk dibuat melalui JavaScript -->
                    </div>

                    <div class="product-empty" id="product-empty" hidden>
                        <i class="bi bi-search"></i>
                        <p>Produk yang kamu cari tidak ditemukan.</p>
                    </div>

                    <!-- PAGINATION -->
                    <nav class="product-pagination" id="product-pagination"
                        aria-label="Navigasi halaman produk"></nav>

                </div>
            </div>

        </section>
    </main>

    <div id="footer"></div>
    <div id="whatsapp"></div>

    <script src="../js/products.js"></script>
    <script>
        // Memuat komponen HTML
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);

                if (!response.ok) {
                    throw new Error(`Gagal memuat ${file}: ${response.status}`);
                }

                let html = await response.text();

                // Menyesuaikan path aset komponen
                html = html.replace(
                    /(src|href)="assets\//g,
                    '$1="../assets/'
                );

                document.getElementById(id).innerHTML = html;

            } catch (error) {
                console.error(error);
            }
        }

        // Efek header ketika halaman di-scroll
        function initHeaderScroll() {
            const header = document.querySelector('.main-header');

            if (!header) return;

            const updateHeader = () => {
                header.classList.toggle('scrolled', window.scrollY > 50);
            };

            window.addEventListener('scroll', updateHeader);
            updateHeader();
        }

        function initMobileNavigation() {
            const toggle = document.querySelector('.nav-toggle');
            const navigation = document.querySelector('.main-nav');

            if (!toggle || !navigation) return;

            const closeMenu = () => {
                navigation.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.setAttribute('aria-label', 'Buka menu navigasi');
                toggle.querySelector('i').className = 'bi bi-list';
            };

            toggle.addEventListener('click', () => {
                const isOpen = navigation.classList.toggle('open');
                toggle.setAttribute('aria-expanded', String(isOpen));
                toggle.setAttribute('aria-label', isOpen ? 'Tutup menu navigasi' : 'Buka menu navigasi');
                toggle.querySelector('i').className = isOpen ? 'bi bi-x-lg' : 'bi bi-list';
            });

            navigation.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) closeMenu();
            });
        }

        const products = window.VerkoopProducts;

        const itemsPerPage = 24;
        let currentPage = 1;
        let filteredProducts = [...products];

        const productGrid = document.getElementById('product-grid');
        const pagination = document.getElementById('product-pagination');
        const emptyMessage = document.getElementById('product-empty');

        // Format harga Rupiah
        function formatRupiah(price) {
            return 'Rp. ' + price.toLocaleString('id-ID');
        }

        // Membuat kartu produk
        function renderProducts() {
            productGrid.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const currentProducts = filteredProducts.slice(
                start,
                start + itemsPerPage
            );

            currentProducts.forEach((product) => {
                const card = document.createElement('article');
                card.className = 'product-card';

                const imageContent = product.image
                    ? `<img src="${product.image}" alt="${product.name}">`
                    : `<div class="product-image-placeholder">
                            <i class="bi ${product.icon}"></i>
                       </div>`;

                card.innerHTML = `
                    <div class="product-image">
                        ${imageContent}
                    </div>

                    <div class="product-information">
                        <div class="product-name-row">
                            <h3>${product.name}</h3>
                            <i class="bi ${product.icon} product-category-icon"></i>
                        </div>

                        <p class="product-price">${formatRupiah(product.price)}</p>

                        <a class="product-detail-button"
                            href="detail.html?id=${product.id}">
                            Lihat Detail
                        </a>
                    </div>
                `;

                productGrid.appendChild(card);
            });

            emptyMessage.hidden = filteredProducts.length > 0;
            productGrid.hidden = filteredProducts.length === 0;

            renderPagination();
        }

        // Membuat pagination
        function renderPagination() {
            pagination.innerHTML = '';

            const totalPages = Math.ceil(
                filteredProducts.length / itemsPerPage
            );

            if (totalPages <= 1) return;

            function addPageButton(page) {
                const button = document.createElement('button');
                button.className = 'pagination-number';
                button.textContent = page;
                button.type = 'button';
                button.setAttribute('aria-label', `Halaman ${page}`);

                if (page === currentPage) {
                    button.classList.add('active');
                    button.setAttribute('aria-current', 'page');
                }

                button.addEventListener('click', () => {
                    changePage(page);
                });

                pagination.appendChild(button);
            }

            function addEllipsis() {
                const ellipsis = document.createElement('span');
                ellipsis.className = 'pagination-ellipsis';
                ellipsis.setAttribute('aria-hidden', 'true');
                ellipsis.textContent = '…';
                pagination.appendChild(ellipsis);
            }

            const previous = document.createElement('button');
            previous.className = 'pagination-arrow';
            previous.textContent = '< Sebelumnya';
            previous.type = 'button';
            previous.disabled = currentPage === 1;
            previous.addEventListener('click', () => {
                changePage(currentPage - 1);
            });
            pagination.appendChild(previous);

            if (totalPages <= 5) {
                for (let page = 1; page <= totalPages; page++) {
                    addPageButton(page);
                }
            } else if (currentPage <= 3) {
                [1, 2, 3].forEach(addPageButton);
                addEllipsis();
                addPageButton(totalPages);
            } else if (currentPage >= totalPages - 2) {
                addPageButton(1);
                addEllipsis();
                for (let page = totalPages - 2; page <= totalPages; page++) {
                    addPageButton(page);
                }
            } else {
                addPageButton(1);
                addEllipsis();
                [currentPage - 1, currentPage, currentPage + 1]
                    .forEach(addPageButton);
                addEllipsis();
                addPageButton(totalPages);
            }

            const next = document.createElement('button');
            next.className = 'pagination-arrow';
            next.textContent = 'Selanjutnya >';
            next.type = 'button';
            next.disabled = currentPage === totalPages;
            next.addEventListener('click', () => {
                changePage(currentPage + 1);
            });

            pagination.appendChild(next);
        }

        function changePage(page) {
            const totalPages = Math.ceil(
                filteredProducts.length / itemsPerPage
            );

            if (page < 1 || page > totalPages || page === currentPage) return;

            currentPage = page;
            renderProducts();

            document.querySelector('.product-content').scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        // Pencarian dan filter kategori
        function initProductFilter() {
            const searchInput = document.getElementById('product-search');
            const categorySelect = document.getElementById('product-category');

            function filterProducts() {
                const keyword = searchInput.value.trim().toLocaleLowerCase('id');
                const category = categorySelect.value;

                filteredProducts = products.filter((product) => {
                    const matchesName = product.name
                        .toLocaleLowerCase('id')
                        .includes(keyword);

                    const matchesCategory = !category ||
                        product.category === category;

                    return matchesName && matchesCategory;
                });

                currentPage = 1;
                renderProducts();
            }

            searchInput.addEventListener('input', filterProducts);
            categorySelect.addEventListener('change', filterProducts);
        }

        // Memuat halaman
        async function loadLandingPage() {
            await loadComponent('header', '../components/header.html');
            initHeaderScroll();
            initMobileNavigation();

            const currentLink = document.querySelector(
                '.main-nav a[href="/pages/produk.html"], .main-nav a[href="produk.html"]'
            );

            if (currentLink) {
                currentLink.setAttribute('aria-current', 'page');
            }

            await loadComponent('footer', '../components/footer.html');
            await loadComponent('whatsapp', '../components/whatsapp.html');
        }

        renderProducts();
        initProductFilter();

        loadLandingPage();
    </script>

</body>
</html>
