
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk | Verkoop</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/produk.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/whatsapp.css">
    <link rel="stylesheet" href="../css/typography.css">
</head>

<body>

    <div id="header"></div>

    <main>
        <section class="product-section">

            <!-- HERO PRODUK -->
            <div class="product-hero">
                <div class="product-container">

                    <h1>Produk</h1>

                    <div class="product-controls">

                        <div class="product-search">
                            <i class="bi bi-search"></i>
                            <input
                                type="search"
                                id="product-search"
                                placeholder="Cari nama produk"
                                autocomplete="off"
                                aria-label="Cari nama produk">
                        </div>

                        <div class="product-filter">
                            <select id="product-category" aria-label="Filter kategori produk">
                                <option value="">Semua Produk</option>
                                <option value="Makanan Berat">Makanan Berat</option>
                                <option value="Makanan Ringan">Makanan Ringan</option>
                                <option value="Minuman">Minuman</option>
                                <option value="Alat Tulis">Alat Tulis</option>
                            </select>
                            <i class="bi bi-sliders"></i>
                        </div>

                    </div>

                </div>
            </div>

            <!-- DAFTAR PRODUK -->
            <div class="product-content">
                <div class="product-container">

                    <div class="product-grid" id="product-grid">
                        <!-- Kartu produk dibuat melalui JavaScript -->
                    </div>

                    <div class="product-empty" id="product-empty" hidden>
                        <i class="bi bi-search"></i>
                        <p>Produk yang kamu cari tidak ditemukan.</p>
                    </div>

                    <!-- PAGINATION -->
                    <nav class="product-pagination" id="product-pagination"
                        aria-label="Navigasi halaman produk"></nav>

                </div>
            </div>

        </section>
    </main>

    <div id="footer"></div>
    <div id="whatsapp"></div>

    <script src="../js/produk.js"></script>

</body>
</html>
